syntax = "proto3";

package stream.v0;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/AnthonyHewins/nalpaca/gen/go/stream/v0;stream";

service StreamService {
	rpc ListBarSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse) {
		option (google.api.http) = {
			get: "/v1/subscriptions/bars"
		};
	}

	rpc AddBarSubscriptions(AddSubscriptionsRequest) returns (AddSubscriptionsResponse) {
		option (google.api.http) = {
			patch: "/v1/subscriptions/bars"
		};
	}

	rpc RemoveBarSubscriptions(RemoveSubscriptionsRequest) returns (RemoveSubscriptionsResponse) {
		option (google.api.http) = {
			delete: "/v1/subscriptions/bars"
		};
	}

	rpc ListStockQuoteSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse) {
		option (google.api.http) = {
			get: "/v1/subscriptions/stocks/quotes"
		};
	}

	rpc AddStockQuoteSubscriptions(AddSubscriptionsRequest) returns (AddSubscriptionsResponse) {
		option (google.api.http) = {
			patch: "/v1/subscriptions/stocks/quotes"
		};
	}

	rpc RemoveStockQuoteSubscriptions(RemoveSubscriptionsRequest) returns (RemoveSubscriptionsResponse) {
		option (google.api.http) = {
			delete: "/v1/subscriptions/stocks/quotes"
		};
	}

	rpc ListStockTradeSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse) {
		option (google.api.http) = {
			get: "/v1/subscriptions/stocks/trades"
		};
	}

	rpc AddStockTradeSubscriptions(AddSubscriptionsRequest) returns (AddSubscriptionsResponse) {
		option (google.api.http) = {
			patch: "/v1/subscriptions/stocks/trades"
		};
	}

	rpc RemoveStockTradeSubscriptions(RemoveSubscriptionsRequest) returns (RemoveSubscriptionsResponse) {
		option (google.api.http) = {
			delete: "/v1/subscriptions/stocks/trades"
		};
	}

	rpc ListNewsSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse) {
		option (google.api.http) = {
			get: "/v1/subscriptions/news"
		};
	}

	rpc AddNewsSubscriptions(AddSubscriptionsRequest) returns (AddSubscriptionsResponse) {
		option (google.api.http) = {
			patch: "/v1/subscriptions/news"
		};
	}

	rpc RemoveNewsSubscriptions(RemoveSubscriptionsRequest) returns (RemoveSubscriptionsResponse) {
		option (google.api.http) = {
			delete: "/v1/subscriptions/news"
		};
	}
}

//====================================
// List subscriptions
//====================================
message ListSubscriptionsRequest {}

message ListSubscriptionsResponse {
	repeated string subscriptions = 1;
}

//====================================
// Add subscription
//====================================
message AddSubscriptionsRequest {
	repeated string symbols = 1;
}

message AddSubscriptionsResponse {}

//====================================
// Remove subscription
//====================================
message RemoveSubscriptionsRequest {
	repeated string symbols = 1;
}

message RemoveSubscriptionsResponse {}

message Bar {
	string symbol = 1;
	double open = 2;
	double high = 3;
	double low = 4;
	double close = 5;
	uint64 volume = 6;
	google.protobuf.Timestamp timestamp = 7;
	uint64 trade_count = 8;
	double vwap = 9;
}

// Trade is a stock trade.
message Trade {
	int64 id = 1;
	string symbol = 2;
	string exchange = 3;
	double price = 4;
	uint32 size = 5;
	google.protobuf.Timestamp timestamp = 6;
	repeated string conditions = 7;
	string tape = 8;
}

// Quote is a stock quote.
message Quote {
	string symbol = 1;
	string bid_exchange = 2;
	double bid_price = 3;
	uint32 bid_size = 4;
	string ask_exchange = 5;
	double ask_price = 6;
	uint32 ask_size = 7;
	google.protobuf.Timestamp timestamp = 8;
	repeated string conditions = 9;
	string tape = 10;
}

message News {
	uint64 id = 1;
	repeated string symbols = 2;
	string headline = 3;
	string author = 4;
	string summary = 5;
	string content = 6;
	string url = 7;
	google.protobuf.Timestamp created_at = 8;
	google.protobuf.Timestamp updated_at = 9;
}
